# sherlock_fixes: entropy with the sweep-fixes kernels (fixes.py configs). Everything else as in the sweep's
# config, which follows.
# Constant B: does not exercise div(B) control.
# Sweep config written by tools/make_sweep_configs.py from sherlock_mhd/configs/entropy.toml.
name = "entropy"
seeds = [42]
t_end = 1.0
frames = 21
exact_reference = "exact nonlinear cell-average entropy advection"
cfl = 0.25
max_run_seconds = 172800
glm_ch_scale = 1.0
glm_cp_coef = 0.18
grids = [32, 64, 128, 256, 512]
methods = ["glm_fix_hll16", "glm_fix_ppm", "glm_fct16", "glm_fct32", "ct_fix"]
split_methods = true
repeats = 1
checkpoint_seconds = 900
max_steps_per_n = 97
restart_every = 5
snapshot_frames_by_grid = { "256" = [0, 4, 8, 12, 16, 20], "512" = [0, 7, 13, 20] }
