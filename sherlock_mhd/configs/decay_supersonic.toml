# Supersonic decaying MHD turbulence inspired by Kritsuk et al. (2011): rms Mach 9, near-isothermal gamma = 1.01, mean field B0 = 0.3 along z (beta0 = 22). Starts from a smooth random field, not their pre-driven saturated state.
name = "decay_supersonic"
problem = "decay"
grids = [64, 128, 256]
seeds = [42, 43]
t_end = 0.2
frames = 11
snapshot_frames = [0, 5, 10]
gamma = "101/100"
mach = 9.0
b0_vector = [0.0, 0.0, 0.3]
slurm_time = "04:00:00"
# RAMSES at 256^3 costs ~1,150 core-h here (~11 h wall on 32 ranks, over the 2 h job limit).
# To include it: add 256 below and submit with --ntasks=128 --time=08:00:00.
ramses_grids = [64, 128]
exact_reference = "none; compare spectra, energy decay and effective Reynolds numbers"
repeats = 5
cfl = 0.25
max_steps = 400000
max_run_seconds = 1800
glm_ch_scale = 1.0
glm_cp_coef = 0.18
