# Movie run of current_sheet (glm): physics identical to configs/current_sheet.toml in sherlock_rerun; dense outputs for video, not timing.
# Gardiner & Stone (2005) sec. 5.5 current sheet (also FLASH 35.2.6, RAMSES patch/mhd/sheet): rho=1, p=0.1, By=+-1, vx=0.1 sin(pi y) on [0,2]^2, scaled to the unit box (one velocity wavelength per box; t=2.5 here is t=5 there). Reconnection driven by numerical resistivity.
name = "movie_current_sheet__glm"
problem = "current_sheet"
t_end = 2.5
u0 = 0.1
cfl = 0.25
max_steps = 200000
glm_ch_scale = 1.0
glm_cp_coef = 0.18
seeds = [42]
methods = ["glm"]
# 241 outputs shorten many steps; keep the CFL-step c_h on those (the original c_h ~ 1/dt made GLM fail)
glm_ch_at_outputs = "cfl"
repeats = 1
frames = 241
grids = [384]
# 384^2 runs as a z-invariant 384^3 cube: 128G, as throughput_ot3d at 384^3 (16G was OOM-killed)
slurm_mem = "128G"
max_run_seconds = 7200
slurm_time = "03:00:00"
external_runs = false
reference_n = 1536
movie_truth = "athenak:reference"
exact_reference = "none; AthenaK PPM/HLLD/RK3 1536^2 block-averaged to 384^2 is the truth panel"
