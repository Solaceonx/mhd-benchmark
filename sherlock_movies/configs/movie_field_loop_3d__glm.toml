# Movie run of field_loop_3d (glm): physics identical to configs/field_loop_3d.toml in sherlock_mhd; dense outputs for video, not timing.
# FLASH 35.2.7 3D / Gardiner & Stone (2008), adapted to a unit cube: loop axis (-1,0,1)/sqrt(2), v=(1,1,2).
name = "movie_field_loop_3d__glm"
problem = "field_loop_3d"
t_end = 1.0
cfl = 0.25
max_steps = 200000
glm_ch_scale = 1.0
