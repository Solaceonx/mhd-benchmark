# Movie run of kh_uniform (glm): physics identical to configs/kh_uniform.toml in sherlock_rerun; dense outputs for video, not timing.
# Tomida et al. (2026) sec. III.1 KH: rho=1, p=10, gamma=5/3, vx=+-1 (tanh width 0.05), vy=0.01 sin(2 pi x) exp(-y^2/0.2^2), Bx=0.01 (beta=2e5). Their single layer with outflow y boundaries becomes a periodic double layer at y=1/4, 3/4.
name = "movie_kh_uniform__glm"
problem = "kh_uniform"
t_end = 3.0
beta = 2e5
cfl = 0.25
max_steps = 200000
glm_ch_scale = 1.0
glm_cp_coef = 0.18
seeds = [42]
methods = ["glm"]
# 241 outputs shorten many steps; keep the CFL-step c_h on those (the original c_h ~ 1/dt made GLM fail)
glm_ch_at_outputs = "cfl"
repeats = 1
frames = 241
grids = [384]
# 384^2 runs as a z-invariant 384^3 cube: 128G, as throughput_ot3d at 384^3 (16G was OOM-killed)
slurm_mem = "128G"
max_run_seconds = 7200
slurm_time = "02:00:00"
external_runs = false
reference_n = 1536
movie_truth = "athenak:reference"
exact_reference = "none; AthenaK PPM/HLLD/RK3 1536^2 block-averaged to 384^2 is the truth panel"
