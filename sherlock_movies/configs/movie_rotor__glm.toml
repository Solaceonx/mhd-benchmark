# Movie run of rotor (glm): physics identical to configs/rotor.toml in sherlock_mhd; dense outputs for video, not timing.
# FLASH 35.2.5 / Balsara & Spicer (1999) first rotor. Periodic instead of non-reflecting: fastest front stays inside the box to t=0.15.
name = "movie_rotor__glm"
problem = "rotor"
t_end = 0.15
gamma = "7/5"
u0 = 2.0
b0 = 5.0
cfl = 0.25
max_steps = 200000
glm_ch_scale = 1.0
glm_cp_coef = 0.18
seeds = [42]
methods = ["glm"]
# 241 outputs shorten many steps; keep the CFL-step c_h on those (the original c_h ~ 1/dt made GLM fail)
glm_ch_at_outputs = "cfl"
repeats = 1
frames = 241
grids = [384]
# 384^2 runs as a z-invariant 384^3 cube: 128G, as throughput_ot3d at 384^3 (16G was OOM-killed)
slurm_mem = "128G"
max_run_seconds = 7200
slurm_time = "03:00:00"
external_runs = false
reference_n = 1536
movie_truth = "athenak:reference"
exact_reference = "none; AthenaK PPM/HLLD/RK3 1536^2 block-averaged to 384^2 is the truth panel"
